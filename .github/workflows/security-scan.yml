name: DevSecOps Security Scanning Pipeline

on:
  push:
    branches: [ main, develop, latest ]
  pull_request:
    branches: [ main, latest ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r vulnerable-app/requirements.txt
        
    # SAST - Static Application Security Testing
    - name: Install Semgrep
      run: |
        python -m pip install semgrep
        
    - name: Run Semgrep SAST Scan
      run: |
        semgrep --config=.semgrep.yml --json --output=semgrep-results.json vulnerable-app/
        semgrep --config=.semgrep.yml --sarif --output=semgrep-results.sarif vulnerable-app/
        
    - name: Upload Semgrep Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep-results.sarif
        
    # Dependency Vulnerability Scanning
    - name: Install OWASP Dependency Check
      run: |
        wget https://github.com/jeremylong/DependencyCheck/releases/download/v8.4.0/dependency-check-8.4.0-release.zip
        unzip dependency-check-8.4.0-release.zip
        chmod +x dependency-check/bin/dependency-check.sh
        
    - name: Run OWASP Dependency Check
      run: |
        ./dependency-check/bin/dependency-check.sh \
          --project "VulnShop" \
          --scan vulnerable-app/ \
          --format "HTML,JSON,SARIF" \
          --out reports/dependency-check \
          --failOnCVSS 7.0
          
    - name: Upload Dependency Check Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: reports/dependency-check/dependency-check-report.sarif
        
    # Container Security Scanning
    - name: Build Docker Image
      run: |
        cd vulnerable-app
        docker build -t vulnshop:latest .
        
    - name: Install Grype
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        
    - name: Run Grype Container Scan
      run: |
        grype vulnshop:latest --output json --file grype-results.json
        grype vulnshop:latest --output sarif --file grype-results.sarif
        
    - name: Upload Grype Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: grype-results.sarif
        
    # Security Gate Evaluation
    - name: Evaluate Security Gates
      run: |
        echo "=== SECURITY GATE EVALUATION ==="
        
        # Count critical SAST findings
        SAST_CRITICAL=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-results.json)
        echo "SAST Critical Findings: $SAST_CRITICAL"
        
        # Count high/critical dependency vulnerabilities
        DEP_HIGH=0
        if [ -f "reports/dependency-check/dependency-check-report.json" ]; then
          DEP_HIGH=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity=="HIGH" or .severity=="CRITICAL")] | length' reports/dependency-check/dependency-check-report.json 2>/dev/null || echo "0")
        fi
        echo "Dependency High/Critical Findings: $DEP_HIGH"
        
        # Count high/critical container vulnerabilities  
        CONTAINER_HIGH=0
        if [ -f "grype-results.json" ]; then
          CONTAINER_HIGH=$(jq '[.matches[] | select(.vulnerability.severity=="High" or .vulnerability.severity=="Critical")] | length' grype-results.json 2>/dev/null || echo "0")
        fi
        echo "Container High/Critical Findings: $CONTAINER_HIGH"
        
        TOTAL_CRITICAL=$((SAST_CRITICAL + DEP_HIGH + CONTAINER_HIGH))
        echo "Total Critical/High Findings: $TOTAL_CRITICAL"
        
        if [ "$TOTAL_CRITICAL" -gt 0 ]; then
          echo "🚨 SECURITY GATE FAILED: $TOTAL_CRITICAL critical/high vulnerabilities found"
          echo "Please fix vulnerabilities before deployment"
          exit 1
        else
          echo "✅ SECURITY GATE PASSED: No critical vulnerabilities detected"
        fi
        
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          semgrep-results.json
          semgrep-results.sarif
          reports/dependency-check/
          grype-results.json
          grype-results.sarif
          
    - name: Security Notification
      if: failure()
      run: |
        echo "🚨 SECURITY ALERT 🚨"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "Critical vulnerabilities detected - deployment blocked"
        # In production, send to Slack/email/ticketing system