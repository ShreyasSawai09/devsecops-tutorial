name: Security Scans (OWASP DC + Grype)

on:
  push:
    branches: [ main, Main, master, latest ]
  pull_request:
    # Run on PRs to any branch (so forks/variants work)
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency_check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (for Dependency-Check)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check
          key: ${{ runner.os }}-dc-cache-${{ hashFiles('**/dependency-check.properties') }}
          restore-keys: |
            ${{ runner.os }}-dc-cache-

      - name: Create reports directory
        run: mkdir -p reports/dependency-check

      - name: Run OWASP Dependency-Check with Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -v "${{ github.workspace }}/reports/dependency-check":/report \
            owasp/dependency-check:latest \
            --project "vulnerable-app" \
            --scan /src/vulnerable-app \
            --format "HTML,JSON,SARIF" \
            --out /report \
            --failOnCVSS 7.0 \
            --enableRetired \
            --noupdate

      - name: List generated files
        run: |
          echo "Files in reports/dependency-check:"
          ls -la reports/dependency-check/ || echo "Directory does not exist"
          echo "Looking for SARIF files:"
          find reports/dependency-check -name "*.sarif" 2>/dev/null || echo "No SARIF files found"

      - name: Upload DC report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: reports/dependency-check

      - name: Find and Upload SARIF (Dependency-Check)
        run: |
          echo "Looking for SARIF files in reports/dependency-check:"
          find reports/dependency-check -name "*.sarif" -type f || echo "No SARIF files found"
          echo "All files in reports/dependency-check:"
          ls -la reports/dependency-check/ || echo "Directory does not exist"
          
          SARIF_FILE=$(find reports/dependency-check -name "*.sarif" | head -1)
          if [ -n "$SARIF_FILE" ]; then
            echo "Found SARIF file: $SARIF_FILE"
            echo "sarif_file=$SARIF_FILE" >> $GITHUB_OUTPUT
          else
            echo "No SARIF file found"
            echo "sarif_file=" >> $GITHUB_OUTPUT
          fi
        id: find_sarif

      - name: Upload SARIF (Dependency-Check)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.find_sarif.outputs.sarif_file != ''
        with:
          sarif_file: ${{ steps.find_sarif.outputs.sarif_file }}

  grype_scan:
    name: Grype Container Scan
    runs-on: ubuntu-latest
    needs: dependency_check
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        working-directory: vulnerable-app
        run: |
          echo "Building Docker image..."
          docker build -t vulnerable-app:ci . || echo "Docker build failed, but continuing..."

      - name: Run Grype scan
        uses: anchore/scan-action@v5
        with:
          image: vulnerable-app:ci
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          by-cve: true
          acs-report-enable: true

      - name: Upload SARIF (Grype)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

      - name: Upload Grype artifact bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-results
          path: |
            results.sarif
            anchore-reports/**


