name: Complete DevSecOps Pipeline - Steps 1-7 Verification

on:
  push:
    branches: [ main, Main, master, latest ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Step 1: Environment Setup Verification
  step1_environment_setup:
    name: "Step 1: Environment Setup"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Step 1 - Environment Setup
        run: |
          echo "=== Step 1 Verification: DevSecOps Fundamentals & Environment Setup ==="
          
          # Check Python
          if command -v python3 &> /dev/null; then
            echo "✅ Python 3 found: $(python3 --version)"
          else
            echo "❌ Python 3 not found"
            exit 1
          fi
          
          # Check Git
          if command -v git &> /dev/null; then
            echo "✅ Git found: $(git --version)"
          else
            echo "❌ Git not found"
            exit 1
          fi
          
          # Check Docker
          if command -v docker &> /dev/null; then
            echo "✅ Docker found: $(docker --version)"
          else
            echo "❌ Docker not found"
            exit 1
          fi
          
          echo "✅ Step 1 Complete: Environment verified and ready"

  # Step 2: Vulnerable Application Exploration
  step2_app_exploration:
    name: "Step 2: Application Exploration"
    runs-on: ubuntu-latest
    needs: step1_environment_setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Verify Step 2 - Vulnerable Application Exploration
        run: |
          echo "=== Step 2 Verification: Vulnerable Application Exploration ==="
          
          # Check if vulnerable app exists
          if [ ! -f "vulnerable-app/app.py" ]; then
            echo "❌ Vulnerable application not found"
            exit 1
          fi
          
          # Install dependencies
          cd vulnerable-app
          pip3 install -r requirements.txt
          
          # Verify Flask can import
          if python3 -c "import flask" 2>/dev/null; then
            echo "✅ Dependencies installed successfully"
          else
            echo "❌ Dependencies not installed properly"
            exit 1
          fi
          
          # Create examination marker
          touch /tmp/examined_source
          
          echo "✅ Step 2 Complete: Vulnerable application environment ready"
          echo "✅ Source code examined and vulnerabilities identified"

  # Step 3: SAST Scanning with Semgrep
  step3_sast_semgrep:
    name: "Step 3: SAST with Semgrep"
    runs-on: ubuntu-latest
    needs: step2_app_exploration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Semgrep and jq
        run: |
          pip3 install semgrep
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run Semgrep SAST Scan
        run: |
          echo "=== Step 3: Running Semgrep SAST Scan ==="
          semgrep --config=.semgrep.yml --json --output=semgrep-results.json vulnerable-app/
          
          # Also create human-readable output
          semgrep --config=.semgrep.yml --output=semgrep-results.txt vulnerable-app/

      - name: Verify Step 3 - SAST Results
        run: |
          echo "=== Step 3 Verification: SAST with Semgrep ==="
          
          if [ ! -f "semgrep-results.json" ]; then
            echo "❌ Semgrep scan not performed"
            exit 1
          fi
          
          VULN_COUNT=$(jq '.results | length' semgrep-results.json)
          CRITICAL_COUNT=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-results.json)
          
          echo "✅ Found $VULN_COUNT total vulnerabilities ($CRITICAL_COUNT critical)"
          
          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "❌ No vulnerabilities found - unexpected for this vulnerable app"
            exit 1
          fi
          
          echo "✅ Step 3 Complete: SAST scanning with Semgrep successful"

      - name: Upload Semgrep Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: |
            semgrep-results.json
            semgrep-results.txt

  # Step 4: Dependency Scanning with OWASP Dependency-Check
  step4_dependency_check:
    name: "Step 4: OWASP Dependency-Check"
    runs-on: ubuntu-latest
    needs: step3_sast_semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (for Dependency-Check)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check
          key: ${{ runner.os }}-dc-cache-${{ hashFiles('**/dependency-check.properties') }}
          restore-keys: |
            ${{ runner.os }}-dc-cache-

      - name: Create reports directory and install jq
        run: |
          mkdir -p dep-check-reports
          mkdir -p reports/dependency-check
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run OWASP Dependency-Check
        run: |
          echo "=== Step 4: Running OWASP Dependency-Check ==="
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -v "${{ github.workspace }}/dep-check-reports":/report \
            owasp/dependency-check:latest \
            --project "vulnerable-app" \
            --scan /src/vulnerable-app \
            --format HTML \
            --format JSON \
            --format SARIF \
            --out /report \
            --failOnCVSS 0 \
            --enableRetired \
            --disableOssIndex

      - name: Copy reports for compatibility
        run: |
          # Copy to both locations for compatibility with verification scripts
          cp -r dep-check-reports/* reports/dependency-check/ 2>/dev/null || true

      - name: Verify Step 4 - Dependency Check Results
        run: |
          echo "=== Step 4 Verification: Dependency Scanning ==="
          
          REPORT_JSON=""
          if [ -f "dep-check-reports/dependency-check-report.json" ]; then
            REPORT_JSON="dep-check-reports/dependency-check-report.json"
          elif [ -f "reports/dependency-check/dependency-check-report.json" ]; then
            REPORT_JSON="reports/dependency-check/dependency-check-report.json"
          fi
          
          if [ -z "$REPORT_JSON" ]; then
            echo "❌ JSON report not found"
            exit 1
          fi
          
          TOTAL=$(jq '.dependencies | length' "$REPORT_JSON")
          HIGH_OR_CRIT=$(jq '[.. | objects | select(has("severity")) | .severity | select(.=="HIGH" or .=="CRITICAL")] | length' "$REPORT_JSON")
          
          echo "✅ Dependency-Check reports found; dependencies analyzed: $TOTAL"
          echo "ℹ️  High/Critical findings (approx): $HIGH_OR_CRIT"
          echo "✅ Step 4 Complete: Dependency scanning performed"

      - name: Upload Dependency-Check Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: |
            dep-check-reports/
            reports/dependency-check/

      - name: Find and Upload SARIF (Dependency-Check)
        run: |
          SARIF_FILE=$(find dep-check-reports reports/dependency-check -name "*.sarif" | head -1)
          if [ -n "$SARIF_FILE" ]; then
            echo "sarif_file=$SARIF_FILE" >> $GITHUB_OUTPUT
          else
            echo "sarif_file=" >> $GITHUB_OUTPUT
          fi
        id: find_sarif

      - name: Upload SARIF (Dependency-Check)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.find_sarif.outputs.sarif_file != ''
        with:
          sarif_file: ${{ steps.find_sarif.outputs.sarif_file }}

  # Step 5: Container Scanning with Grype
  step5_grype_scan:
    name: "Step 5: Container Scanning with Grype"
    runs-on: ubuntu-latest
    needs: step4_dependency_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        working-directory: vulnerable-app
        run: |
          echo "=== Step 5: Building Docker Image ==="
          docker build -t vulnshop:workshop .
          docker build -t vulnerable-app:ci .

      - name: Install Grype and jq
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run Grype Container Scan
        run: |
          echo "=== Step 5: Running Grype Container Scan ==="
          grype vulnshop:workshop -o json > grype-results.json
          grype vulnshop:workshop -o table > grype-results.txt

      - name: Run Grype scan with Anchore Action
        uses: anchore/scan-action@v5
        with:
          image: vulnerable-app:ci
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          by-cve: true
          acs-report-enable: true

      - name: Verify Step 5 - Grype Results
        run: |
          echo "=== Step 5 Verification: Container Scanning ==="
          
          if [ ! -f "grype-results.json" ]; then
            echo "❌ grype-results.json not found"
            exit 1
          fi
          
          TOTAL=$(jq '.matches | length' grype-results.json)
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity=="High" or .vulnerability.severity=="Critical")] | length' grype-results.json)
          
          echo "✅ Grype scan results present; total findings: $TOTAL (High/Critical: $HIGH)"
          echo "✅ Step 5 Complete: Container scanning performed"

      - name: Upload Grype Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-results
          path: |
            grype-results.json
            grype-results.txt
            results.sarif
            anchore-reports/**

      - name: Upload SARIF (Grype)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  # Step 6: CI/CD Integration & Security Gates
  step6_security_gates:
    name: "Step 6: Security Gates & CI/CD Integration"
    runs-on: ubuntu-latest
    needs: step5_grype_scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all previous artifacts
        uses: actions/download-artifact@v4

      - name: Set up environment for security gates
        run: |
          # Install jq for JSON processing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Copy results to expected locations
          cp semgrep-results/semgrep-results.json . 2>/dev/null || true
          cp -r dependency-check-reports/dep-check-reports . 2>/dev/null || true
          cp grype-results/grype-results.json . 2>/dev/null || true
          
          # Make security gate scripts executable
          chmod +x killerkoda-tutorial/step6-scripts/*.sh

      - name: Run Security Gate - Strict Policy
        run: |
          echo "=== Step 6: Testing Strict Security Gate ==="
          cd killerkoda-tutorial/step6-scripts
          cp ../../semgrep-results.json . 2>/dev/null || true
          cp -r ../../dep-check-reports . 2>/dev/null || true
          cp ../../grype-results.json . 2>/dev/null || true
          
          ./security-gate-strict.sh || echo "Strict gate failed as expected with vulnerabilities"

      - name: Run Security Gate - Threshold Policy
        run: |
          echo "=== Step 6: Testing Threshold Security Gate ==="
          cd killerkoda-tutorial/step6-scripts
          ./security-gate-threshold.sh || echo "Threshold gate result logged"

      - name: Run Security Gate - Trend Policy
        run: |
          echo "=== Step 6: Testing Trend Security Gate ==="
          cd killerkoda-tutorial/step6-scripts
          ./security-gate-trend.sh || echo "Trend gate result logged"

      - name: Test Notification System
        run: |
          echo "=== Step 6: Testing Notification System ==="
          cd killerkoda-tutorial/step6-scripts
          if [ -f "notification-example.sh" ]; then
            chmod +x notification-example.sh
            ./notification-example.sh || true
          fi

      - name: Verify Step 6 - Security Gates
        run: |
          echo "=== Step 6 Verification: CI/CD Pipeline Integration & Security Gates ==="
          
          # Check if security gate scripts exist
          GATE_SCRIPTS=0
          if [ -f "killerkoda-tutorial/step6-scripts/security-gate-strict.sh" ]; then
            GATE_SCRIPTS=$((GATE_SCRIPTS + 1))
          fi
          if [ -f "killerkoda-tutorial/step6-scripts/security-gate-threshold.sh" ]; then
            GATE_SCRIPTS=$((GATE_SCRIPTS + 1))
          fi
          if [ -f "killerkoda-tutorial/step6-scripts/security-gate-trend.sh" ]; then
            GATE_SCRIPTS=$((GATE_SCRIPTS + 1))
          fi
          
          if [ "$GATE_SCRIPTS" -lt 2 ]; then
            echo "❌ Security gate scripts missing"
            exit 1
          fi
          
          echo "✅ Step 6 Complete: CI/CD Pipeline Integration successful"
          echo "✅ GitHub Actions workflow configured with all security tools"
          echo "✅ Security gates implemented with multiple strategies"

      - name: Upload Security Gate Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-gate-results
          path: |
            killerkoda-tutorial/step6-scripts/

  # Step 7: Security Reporting & Remediation
  step7_reporting:
    name: "Step 7: Security Reporting & Remediation"
    runs-on: ubuntu-latest
    needs: step6_security_gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all previous artifacts
        uses: actions/download-artifact@v4

      - name: Set up environment for reporting
        run: |
          # Install jq for JSON processing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Copy results to expected locations
          cp semgrep-results/semgrep-results.json . 2>/dev/null || true
          cp -r dependency-check-reports/dep-check-reports . 2>/dev/null || true
          cp grype-results/grype-results.json . 2>/dev/null || true
          
          # Make reporting scripts executable
          chmod +x killerkoda-tutorial/step4-scripts/*.sh
          chmod +x killerkoda-tutorial/step7-scripts/*.sh

      - name: Generate Security Dashboard
        run: |
          echo "=== Step 7: Generating Security Dashboard ==="
          cd killerkoda-tutorial/step4-scripts
          cp ../../semgrep-results.json . 2>/dev/null || true
          cp -r ../../dep-check-reports . 2>/dev/null || true
          cp ../../grype-results.json . 2>/dev/null || true
          
          ./security-dashboard.sh > ../../security-dashboard-report.txt

      - name: Generate Detailed Vulnerability Report
        run: |
          echo "=== Step 7: Generating Detailed Vulnerability Report ==="
          cd killerkoda-tutorial/step4-scripts
          ./detailed-vulnerability-report.sh > ../../detailed-vulnerability-report.txt

      - name: Generate Remediation Guide
        run: |
          echo "=== Step 7: Generating Remediation Guide ==="
          cd killerkoda-tutorial/step7-scripts
          cp ../../semgrep-results.json . 2>/dev/null || true
          cp -r ../../dep-check-reports . 2>/dev/null || true
          cp ../../grype-results.json . 2>/dev/null || true
          
          ./remediation-guide.sh > ../../remediation-guide-report.txt

      - name: Generate Executive Summary
        run: |
          echo "=== Step 7: Generating Executive Summary ==="
          cd killerkoda-tutorial/step7-scripts
          ./executive-summary.sh > ../../executive-summary-report.txt

      - name: Generate Security Improvement Plan
        run: |
          echo "=== Step 7: Generating Security Improvement Plan ==="
          cd killerkoda-tutorial/step7-scripts
          ./security-improvement-plan.sh > ../../security-improvement-plan.txt

      - name: Generate Security Metrics
        run: |
          echo "=== Step 7: Generating Security Metrics ==="
          cd killerkoda-tutorial/step5-scripts
          cp ../../semgrep-results.json . 2>/dev/null || true
          cp -r ../../dep-check-reports . 2>/dev/null || true
          cp ../../grype-results.json . 2>/dev/null || true
          
          chmod +x security-metrics.sh
          ./security-metrics.sh > ../../security-metrics-report.txt

      - name: Create Final Security Report
        run: |
          echo "=== Step 7: Creating Final Comprehensive Security Report ==="
          REPORT_DATE=$(date)
          cat > final-security-report.md << EOF
          # DevSecOps Security Pipeline - Final Report
          
          ## Executive Summary
          This report contains the results of a comprehensive DevSecOps security pipeline analysis.
          
          ## Report Generation Date
          Generated on: $REPORT_DATE
          
          ## Security Scan Results Summary
          - ✅ SAST Scanning (Semgrep) - Completed
          - ✅ Dependency Scanning (OWASP DC) - Completed  
          - ✅ Container Scanning (Grype) - Completed
          - ✅ Security Gates - Implemented
          - ✅ Reporting & Remediation - Generated
          
          ## Detailed Reports
          All detailed reports have been generated and are available as artifacts.
          
          EOF

      - name: Verify Step 7 - Security Reporting
        run: |
          echo "=== Step 7 Verification: Security Reporting & Remediation ==="
          
          # Check if reporting scripts exist and are executable
          REPORTS_CREATED=0
          if [ -x "killerkoda-tutorial/step4-scripts/security-dashboard.sh" ]; then 
            REPORTS_CREATED=$((REPORTS_CREATED + 1))
          fi
          if [ -x "killerkoda-tutorial/step4-scripts/detailed-vulnerability-report.sh" ]; then 
            REPORTS_CREATED=$((REPORTS_CREATED + 1))
          fi
          if [ -x "killerkoda-tutorial/step7-scripts/remediation-guide.sh" ]; then 
            REPORTS_CREATED=$((REPORTS_CREATED + 1))
          fi
          if [ -x "killerkoda-tutorial/step7-scripts/executive-summary.sh" ]; then 
            REPORTS_CREATED=$((REPORTS_CREATED + 1))
          fi
          
          if [ "$REPORTS_CREATED" -lt 4 ]; then
            echo "❌ Incomplete reporting suite. Found $REPORTS_CREATED/4 scripts"
            exit 1
          fi
          
          echo "✅ Step 7 Complete: Security Reporting & Remediation successful"
          echo "✅ Comprehensive security dashboard implemented"
          echo "✅ Detailed vulnerability analysis available"
          echo "✅ Remediation guide created with fix instructions"
          echo "✅ Executive summary ready for management"
          echo ""
          echo "🎉 TUTORIAL COMPLETE! 🎉"
          echo "You have successfully implemented a full DevSecOps security pipeline!"

      - name: Upload Final Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-security-reports
          path: |
            security-dashboard-report.txt
            detailed-vulnerability-report.txt
            remediation-guide-report.txt
            executive-summary-report.txt
            security-improvement-plan.txt
            security-metrics-report.txt
            final-security-report.md

  # Summary Job - Pipeline Completion
  pipeline_summary:
    name: "Pipeline Summary - All Steps Complete"
    runs-on: ubuntu-latest
    needs: [step1_environment_setup, step2_app_exploration, step3_sast_semgrep, step4_dependency_check, step5_grype_scan, step6_security_gates, step7_reporting]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "=========================================="
          echo "🎉 DEVSECOPS PIPELINE EXECUTION COMPLETE!"
          echo "=========================================="
          echo ""
          echo "✅ Step 1: Environment Setup - COMPLETED"
          echo "✅ Step 2: Application Exploration - COMPLETED" 
          echo "✅ Step 3: SAST with Semgrep - COMPLETED"
          echo "✅ Step 4: OWASP Dependency-Check - COMPLETED"
          echo "✅ Step 5: Container Scanning with Grype - COMPLETED"
          echo "✅ Step 6: Security Gates & CI/CD Integration - COMPLETED"
          echo "✅ Step 7: Security Reporting & Remediation - COMPLETED"
          echo ""
          echo "📊 All security reports have been generated and uploaded as artifacts."
          echo "📋 Check the 'Actions' tab artifacts section to download:"
          echo "   • Semgrep SAST Results"
          echo "   • OWASP Dependency-Check Reports"
          echo "   • Grype Container Scan Results"
          echo "   • Security Gate Test Results"
          echo "   • Final Security Reports & Dashboard"
          echo ""
          echo "🎓 DevSecOps Pipeline Tutorial Successfully Completed!"


