rules:
  - id: sql-injection-format-string
    patterns:
      - pattern: |
          $CURSOR.execute($QUERY)
      - metavariable-regex:
          metavariable: $QUERY
          regex: '.*[fF].*\{.*\}.*'
    message: |
      Potential SQL injection vulnerability detected. Using f-strings or .format() 
      to construct SQL queries can lead to SQL injection attacks.
    languages: [python]
    severity: ERROR
    
  - id: sql-injection-string-concat
    patterns:
      - pattern-either:
          - pattern: |
              $CURSOR.execute(... + $VAR + ...)
          - pattern: |
              $CURSOR.execute($STR % $VAR)
    message: |
      SQL injection vulnerability: String concatenation used in SQL query construction.
      Use parameterized queries instead.
    languages: [python]
    severity: ERROR

  - id: hardcoded-secret-key
    patterns:
      - pattern: |
          app.secret_key = $SECRET
      - metavariable-regex:
          metavariable: $SECRET
          regex: '^"[^"]*"$'
    message: |
      Hardcoded secret key detected. Secret keys should be stored in environment 
      variables or secure configuration files.
    languages: [python]
    severity: WARNING

  - id: command-injection-subprocess
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, shell=True, ...)
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: os.system($CMD)
    message: |
      Command injection vulnerability: User input may be executed as system commands.
      This can lead to remote code execution.
    languages: [python]
    severity: ERROR

  - id: flask-debug-enabled
    patterns:
      - pattern: |
          app.run(..., debug=True, ...)
    message: |
      Flask debug mode enabled. This should never be used in production as it
      exposes sensitive information and allows code execution.
    languages: [python]
    severity: WARNING

  - id: insecure-pickle-loads
    patterns:
      - pattern: pickle.loads($DATA)
    message: |
      Insecure deserialization with pickle.loads(). This can lead to remote code
      execution if untrusted data is deserialized.
    languages: [python]
    severity: ERROR

  - id: open-redirect
    patterns:
      - pattern: |
          redirect($URL)
      - pattern-not: |
          redirect(url_for(...))
    message: |
      Potential open redirect vulnerability. Redirecting to user-controlled URLs
      can be used for phishing attacks.
    languages: [python]
    severity: WARNING