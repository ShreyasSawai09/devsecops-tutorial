# OWASP Dependency Check Configuration
# Enable retired packages scanning
enableRetired=true

# Enable experimental analyzers
enableExperimental=true

# Fail build on CVSS score threshold
failBuildOnCVSS=7.0

# Skip certain file types if needed
skipTestScope=false

# Database update settings
autoUpdate=true

# Suppression file (optional)
# suppressionFile=dependency-check-suppressions.xml